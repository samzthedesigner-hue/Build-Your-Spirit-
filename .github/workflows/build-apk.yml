name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          
      - name: Write Gradle config
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "BuildYourSpirit"
          include ":app"
          EOF
          
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          
          mkdir -p app
          cat > app/build.gradle <<EOF
          plugins { id 'com.android.application' }
          android {
              namespace 'com.buildyourspirit.app'
              compileSdk 34
              
              sourceSets {
                  main {
                      // Bundles everything in res/ so the MP3s can be found
                      assets.srcDirs = ['src/main/assets', 'src/main/res']
                  }
              }
              
              defaultConfig {
                  applicationId "com.buildyourspirit.app"
                  minSdk 26
                  targetSdk 34
                  versionCode \${{ github.run_number }}
                  versionName "1.0.\${{ github.run_number }}"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies { }
          EOF
          
          echo "org.gradle.jvmargs=-Xmx2048m" > gradle.properties
          
      - run: gradle wrapper --gradle-version 8.7
      
      - run: ./gradlew assembleDebug --no-daemon
      
      - uses: actions/upload-artifact@v4
        with:
          name: BuildYourSpirit-\${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.\${{ github.run_number }}
          name: Build Your Spirit v1.0.\${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
